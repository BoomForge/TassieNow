name: TassieNow catalogue quality pass

on:
  schedule:
    - cron: '47 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover/**'
      - '.github/workflows/catalogue-quality.yml'
      - 'src/data/discovery-reviews.json'

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  enrich-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Discover and verify markets from council and tourism directories
        run: node scripts/discover/official-markets.mjs
      - name: Preserve market discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discovery-report
          path: |
            src/data/discovery-report.json
            src/data/discovery-candidates.json
          retention-days: 30
      - name: Validate discovery data
        run: npm run validate:data
      - name: Publish discovery results before long enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/places.json src/data/events.json src/data/discovery-candidates.json src/data/discovery-report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): publish verified market discovery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enrich OSM and structured listing details
        run: node scripts/enrich-details.mjs
      - name: Link unresolved listings to Wikidata
        env:
          MAX_WIKIDATA_LINKS: '350'
        run: node scripts/link-wikidata.mjs
      - name: Harvest Wikidata official metadata
        run: node scripts/enrich-wikidata-metadata.mjs
      - name: Verify and promote official sources
        run: node scripts/verify-official-sources.mjs
      - name: Crawl official visit, hours, contact and date pages
        run: node scripts/enrich-official-pages.mjs
      - name: Upgrade exact Wikidata listing images
        env:
          MAX_WIKIDATA_MEDIA: '250'
          WIKIDATA_GALLERY_SIZE: '6'
        run: node scripts/enrich-wikidata-images.mjs
      - name: Full licensed hero and gallery sweep on manual quality run
        if: github.event_name == 'workflow_dispatch'
        env:
          MAX_IMAGE_ENRICH: '1400'
          GALLERY_SIZE: '8'
        run: node scripts/enrich-images.mjs
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Re-rank catalogue using completeness
        run: node scripts/rank-catalogue.mjs
      - name: Generate catalogue coverage audit
        run: node scripts/catalogue-audit.mjs
      - name: Validate enriched site
        run: npm run build
      - name: Commit catalogue improvements
        run: |
          if git diff --quiet -- src/data/places.json src/data/events.json src/data/catalogue-audit.json src/data/discovery-candidates.json src/data/discovery-report.json; then
            echo "No catalogue quality changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/places.json src/data/events.json src/data/catalogue-audit.json src/data/discovery-candidates.json src/data/discovery-report.json
          git commit -m "chore(data): discover markets and enrich catalogue"
          git pull --rebase origin main
          git push origin HEAD:main
