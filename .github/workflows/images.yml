name: Improve TassieNow listing images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/images.yml'
      - 'scripts/reapply-image-upgrades.mjs'
      - 'scripts/enrich-event-images.mjs'
      - 'scripts/enrich-images.mjs'
      - 'scripts/apply-verified-photo-picks.mjs'
      - 'scripts/discover/lib/verified-photo-picks.mjs'
      - 'scripts/enrich-wikidata-images.mjs'
      - 'scripts/discover/lib/event-media.mjs'
      - 'scripts/discover/lib/event-image-policy.mjs'
      - 'scripts/discover/lib/verified-event-venues.mjs'
      - 'scripts/discover/lib/verified-event-performers.mjs'
      - 'scripts/discover/lib/verified-event-history.mjs'
      - 'scripts/reapply-event-image-upgrades.mjs'
      - 'scripts/reapply-event-review.mjs'
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tassienow-image-publishing
  queue: max
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Save pre-enrichment photo baseline
        run: |
          cp src/data/places.json /tmp/tassienow-places-before-images.json
          cp src/data/events.json /tmp/tassienow-events-before-images.json
      - name: Enrich missing event images and inspect organiser photos
        env:
          MAX_EVENT_IMAGE_ENRICH: '40'
        run: node scripts/enrich-event-images.mjs
      - name: Retain event source image and rights review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-image-review
          path: reports/event-image-discovery.json
          retention-days: 30
      - name: Upgrade exact Wikidata listing images
        run: node scripts/enrich-wikidata-images.mjs
      - name: Upgrade fallback images
        env:
          MAX_IMAGE_ENRICH: '65'
        run: node scripts/enrich-images.mjs
      - name: Apply strictly verified missed place photographs
        run: node scripts/apply-verified-photo-picks.mjs
      - name: Preserve place-image source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-image-discovery
          path: reports/place-image-discovery.json
          retention-days: 30
      - name: Re-rank catalogue
        run: node scripts/rank-catalogue.mjs
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Generate catalogue coverage audit
        run: node scripts/catalogue-audit.mjs
      - name: Guard against large real-photo regressions
        run: node scripts/check-media-regression.mjs /tmp/tassienow-places-before-images.json
      - name: Validate catalogue
        run: node scripts/validate-data.mjs
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Commit improved images without losing concurrent catalogue changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the exact enrichment diff. Another event/discovery job may
          # advance main while Commons image lookups are running.
          cp src/data/places.json /tmp/tassienow-places-after-images.json
          cp src/data/events.json /tmp/tassienow-events-after-images.json
          cp src/data/event-media-review.json /tmp/tassienow-event-photo-review-after-images.json
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Publishing verified image improvements, attempt $attempt/4"
            git fetch origin main
            git reset --hard origin/main
            node scripts/reapply-image-upgrades.mjs /tmp/tassienow-places-before-images.json /tmp/tassienow-places-after-images.json
            node scripts/reapply-event-image-upgrades.mjs /tmp/tassienow-events-before-images.json /tmp/tassienow-events-after-images.json
            node scripts/reapply-event-review.mjs /tmp/tassienow-event-photo-review-after-images.json
            node scripts/prune-expired-events.mjs
            node scripts/rank-catalogue.mjs
            node scripts/catalogue-audit.mjs
            node scripts/validate-data.mjs
            if git diff --quiet -- src/data/places.json src/data/events.json src/data/event-media-review.json src/data/catalogue-audit.json; then
              echo "No additional verified image improvements remain to publish."
              exit 0
            fi
            git add src/data/places.json src/data/events.json src/data/event-media-review.json src/data/catalogue-audit.json
            git commit -m "data: improve licensed listing images"
            if git push origin HEAD:main; then
              gh workflow run verify-published-event-images.yml --ref main
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Image publishing still conflicted after four safe retries."
          exit 1
