name: Improve TassieNow listing images

on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Upgrade exact Wikidata listing images
        run: node scripts/enrich-wikidata-images.mjs
      - name: Upgrade fallback images
        run: node scripts/enrich-images.mjs
      - name: Re-rank catalogue
        run: node scripts/rank-catalogue.mjs
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Generate catalogue coverage audit
        run: node scripts/catalogue-audit.mjs
      - name: Validate catalogue
        run: node scripts/validate-data.mjs
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Commit improved images
        run: |
          if git diff --quiet -- src/data/places.json src/data/events.json src/data/catalogue-audit.json; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/places.json src/data/events.json src/data/catalogue-audit.json
          git commit -m "data: improve licensed listing images"
          git push
