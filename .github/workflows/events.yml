name: Refresh TassieNow events

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover/events.mjs'
      - 'scripts/discover/public-events.mjs'
      - 'scripts/discover/verified-regional-events.mjs'
      - 'scripts/discover/independent-ticketebo.mjs'
      - 'scripts/enrich-event-images.mjs'
      - 'scripts/preserve-event-images.mjs'
      - 'scripts/discover/lib/event-media.mjs'
      - 'scripts/discover/lib/event-image-policy.mjs'
      - 'scripts/sanitize-events.mjs'
      - 'scripts/enrich-event-tickets.mjs'
      - 'scripts/sanitize-ticket-data.mjs'
      - 'scripts/prune-expired-events.mjs'
      - 'scripts/catalogue-audit.mjs'
      - 'scripts/validate-data.mjs'
      - '.github/workflows/events.yml'
  schedule:
    - cron: '11 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tassienow-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Snapshot verified event imagery
        run: cp src/data/events.json /tmp/tassienow-events-before-refresh.json
      - name: Refresh official council events
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/discover/events.mjs 2>&1 | tee reports/council-events-fetch.log
      - name: Refresh tourism and ticket-marketplace events
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/discover/public-events.mjs 2>&1 | tee reports/public-events-fetch.log
      - name: Verify dated organiser events in underserved regions
        run: node scripts/discover/verified-regional-events.mjs
      - name: Discover independent community and exhibition tickets
        run: node scripts/discover/independent-ticketebo.mjs
      - name: Retain actual source fetch and parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-event-source-evidence
          path: |
            reports/*-events-fetch.log
            reports/regional-events-evidence.json
            reports/ticketebo-discovery.json
            reports/event-image-discovery.json
          retention-days: 30
      - name: Preserve verified media across all discovery sources
        run: node scripts/preserve-event-images.mjs /tmp/tassienow-events-before-refresh.json
      - name: Search licensed event photographs and organiser artwork
        env:
          MAX_EVENT_IMAGE_ENRICH: '32'
        run: node scripts/enrich-event-images.mjs
      - name: Sanitize discovered events
        run: node scripts/sanitize-events.mjs
      - name: Enrich event-specific tickets prices and availability
        run: node scripts/enrich-event-tickets.mjs
      - name: Enforce verified ticket URLs and Australian pricing
        run: node scripts/sanitize-ticket-data.mjs
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Generate catalogue coverage audit
        run: node scripts/catalogue-audit.mjs
      - name: Validate catalogue
        run: node scripts/validate-data.mjs
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Build refreshed site
        run: npm run build
      - name: Commit event changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/events.json src/data/event-media-review.json src/data/catalogue-audit.json; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/events.json src/data/event-media-review.json src/data/catalogue-audit.json
          git commit -m "data: refresh Tasmanian events and verified booking links"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run verify-published-event-images.yml --ref main
          gh workflow run verify-event-artwork.yml --ref main
