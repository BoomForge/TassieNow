name: TassieNow quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit installed production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax-check automation and Pages Functions
        run: |
          node --check scripts/discover/official-markets.mjs
          node --check scripts/discover/lib/regions.mjs
          node --check scripts/reclassify-regions.mjs
          node --check scripts/discover/lib/official-discovery.mjs
          node --check scripts/discover/events.mjs
          node --check scripts/discover/public-events.mjs
          node --check scripts/discover/wikidata-import.mjs
          node --check scripts/discover/parks-tasmania.mjs
          node --check scripts/merge-previous-catalogue.mjs
          node --check scripts/discover/lib/preserve-media.mjs
          node --check scripts/restore-licensed-images.mjs
          node --check scripts/check-media-regression.mjs
          node --check scripts/production-smoke.mjs
          node --check scripts/enrich-details.mjs
          node --check scripts/link-wikidata.mjs
          node --check scripts/enrich-wikidata-metadata.mjs
          node --check scripts/verify-official-sources.mjs
          node --check scripts/enrich-official-pages.mjs
          node --check scripts/sanitize-events.mjs
          node --check scripts/enrich-event-tickets.mjs
          node --check scripts/sanitize-ticket-data.mjs
          node --check scripts/enrich-event-images.mjs
          node --check scripts/preserve-event-images.mjs
          node --check scripts/reapply-event-image-upgrades.mjs
          node --check scripts/discover/lib/event-media.mjs
          node --check scripts/enrich-images.mjs
          node --check scripts/enrich-wikidata-images.mjs
          node --check scripts/catalogue-audit.mjs
          node --check scripts/prune-expired-events.mjs
          node --check scripts/rank-catalogue.mjs
          node --check scripts/catalogue-audit.mjs
          node --check scripts/automation-heartbeat.mjs
          node --check scripts/check-operations.mjs
          node --check scripts/test-catalogue-recovery.mjs
          node --check scripts/audit-built-site.mjs
          node --check scripts/indexnow.mjs
          node --check scripts/post-bluesky.mjs
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Prove non-destructive catalogue Git restore
        run: node scripts/test-catalogue-recovery.mjs
      - name: Test discovery, market classification and recurring dates
        run: npm run test:discovery
      - name: Test daily promotion selection
        env:
          DRY_RUN: '1'
        run: node scripts/post-bluesky.mjs
      - name: Sanitize event records in CI workspace
        run: node scripts/sanitize-events.mjs
      - name: Enforce verified ticket URLs and Australian pricing
        run: node scripts/sanitize-ticket-data.mjs
      - name: Prune expired events in CI workspace
        run: node scripts/prune-expired-events.mjs
      - name: Apply catalogue ranking in CI workspace
        run: node scripts/rank-catalogue.mjs
      - name: Generate catalogue coverage audit
        run: node scripts/catalogue-audit.mjs
      - name: Reject stale image coverage reports
        run: node scripts/check-image-coverage.mjs
      - name: Validate and build ranked site
        run: npm run build
      - name: Audit rendered SEO and large assets
        run: node scripts/audit-built-site.mjs
      - name: Preserve build audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-build-audit
          path: reports/launch-build-audit.json
          retention-days: 30
