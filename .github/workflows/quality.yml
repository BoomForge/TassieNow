name: TassieNow quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check automation and Pages Functions
        run: |
          node --check scripts/discover/events.mjs
          node --check scripts/discover/parks-tasmania.mjs
          node --check scripts/enrich-details.mjs
          node --check scripts/enrich-images.mjs
          node --check scripts/rank-catalogue.mjs
          node --check scripts/indexnow.mjs
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Apply catalogue ranking in CI workspace
        run: node scripts/rank-catalogue.mjs
      - name: Validate and build ranked site
        run: npm run build
