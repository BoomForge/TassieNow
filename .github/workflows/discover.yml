name: Refresh TassieNow catalogue

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover/**'
      - 'scripts/merge-previous-catalogue.mjs'
      - 'scripts/discover/lib/preserve-media.mjs'
      - 'scripts/check-media-regression.mjs'
      - 'scripts/reclassify-regions.mjs'
      - 'scripts/enrich-details.mjs'
      - 'scripts/link-wikidata.mjs'
      - 'scripts/enrich-official-pages.mjs'
      - 'scripts/sanitize-events.mjs'
      - 'scripts/enrich-event-tickets.mjs'
      - 'scripts/sanitize-ticket-data.mjs'
      - 'scripts/prune-expired-events.mjs'
      - 'scripts/rank-catalogue.mjs'
      - 'scripts/enrich-images.mjs'
      - 'scripts/enrich-event-images.mjs'
      - 'scripts/preserve-event-images.mjs'
      - 'scripts/enrich-wikidata-images.mjs'
      - 'scripts/sanitize-generated.mjs'
      - 'scripts/audit-links.mjs'
      - 'scripts/catalogue-audit.mjs'
      - 'scripts/validate-data.mjs'
      - 'src/data/place-overrides.json'
      - '.github/workflows/discover.yml'
  schedule:
    - cron: '17 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Preserve previous catalogue snapshot
        run: cp src/data/places.json /tmp/tassienow-places-before-discovery.json
      - name: Discover Tasmanian places from OpenStreetMap
        run: node scripts/discover/osm-import.mjs
      - name: Recover prior listings if OSM coverage is partial
        run: node scripts/merge-previous-catalogue.mjs /tmp/tassienow-places-before-discovery.json
      - name: Discover independent Wikidata places
        run: node scripts/discover/wikidata-import.mjs
      - name: Reclassify generated listings into discovery regions
        run: node scripts/reclassify-regions.mjs
      - name: Enrich official Parks Tasmania walks
        run: node scripts/discover/parks-tasmania.mjs
      - name: Snapshot event image provenance before source refresh
        run: cp src/data/events.json /tmp/tassienow-events-before-discovery.json
      - name: Discover official council events
        run: node scripts/discover/events.mjs
      - name: Discover tourism and ticket-marketplace events
        run: node scripts/discover/public-events.mjs
      - name: Verify dated regional organiser events
        run: node scripts/discover/verified-regional-events.mjs
      - name: Discover independent community and exhibition tickets
        run: node scripts/discover/independent-ticketebo.mjs
      - name: Preserve previously licensed event imagery
        run: node scripts/preserve-event-images.mjs /tmp/tassienow-events-before-discovery.json
      - name: Enrich real event imagery and research organisers
        env:
          MAX_EVENT_IMAGE_ENRICH: '36'
        run: node scripts/enrich-event-images.mjs
      - name: Upload event photo review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-photo-discovery
          path: reports/event-image-discovery.json
          retention-days: 30
      - name: Sanitize discovered events
        run: node scripts/sanitize-events.mjs
      - name: Enrich event-specific tickets prices and availability
        run: node scripts/enrich-event-tickets.mjs
      - name: Enforce verified ticket URLs and Australian pricing
        run: node scripts/sanitize-ticket-data.mjs
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Audit external websites
        run: node scripts/audit-links.mjs
      - name: Sanitize generated records
        run: node scripts/sanitize-generated.mjs
      - name: Discover and verify markets from council and tourism directories
        run: node scripts/discover/official-markets.mjs
      - name: Preserve market discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discovery-report
          path: |
            src/data/discovery-report.json
            src/data/discovery-candidates.json
          retention-days: 30
      - name: Enrich OSM and structured listing details
        run: node scripts/enrich-details.mjs
      - name: Crawl official visit, hours, contact and date pages
        run: node scripts/enrich-official-pages.mjs
      - name: Rank and suppress low-value catalogue records
        run: node scripts/rank-catalogue.mjs
      - name: Upgrade exact Wikidata listing images
        run: node scripts/enrich-wikidata-images.mjs
      - name: Upgrade licensed hero and gallery images
        run: node scripts/enrich-images.mjs
      - name: Re-rank after image enrichment
        run: node scripts/rank-catalogue.mjs
      - name: Recover known-good licensed photographs by exact source identity
        run: |
          git show da31ddb4d:src/data/places.json > /tmp/tassienow-known-good-licensed-media.json
          node scripts/restore-licensed-images.mjs /tmp/tassienow-known-good-licensed-media.json
      - name: Generate catalogue coverage audit
        run: node scripts/catalogue-audit.mjs
      - name: Guard against large real-photo regressions
        run: node scripts/check-media-regression.mjs /tmp/tassienow-places-before-discovery.json
      - name: Validate catalogue
        run: node scripts/validate-data.mjs
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Build refreshed site
        run: npm run build
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- src/data/places.json src/data/events.json src/data/event-media-review.json src/data/parks-walks.json src/data/catalogue-audit.json src/data/discovery-candidates.json src/data/discovery-report.json; then
            echo "No catalogue changes."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/places.json src/data/events.json src/data/event-media-review.json src/data/parks-walks.json src/data/catalogue-audit.json src/data/discovery-candidates.json src/data/discovery-report.json
          git commit -m "data: refresh multi-source Tasmanian discovery catalogue"
          git pull --rebase origin main
          git push origin HEAD:main
