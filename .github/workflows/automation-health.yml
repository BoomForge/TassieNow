name: TassieNow automation heartbeat

on:
  schedule:
    - cron: '7 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/automation-heartbeat.mjs'
      - '.github/workflows/automation-health.yml'

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record scheduled heartbeat
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/automation-heartbeat.mjs
      - name: Commit scheduled heartbeat
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- src/data/automation-health.json; then
            echo "Heartbeat already recorded for today."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/automation-health.json
          git commit -m "chore: record scheduled automation heartbeat [skip ci]"
          git push origin HEAD:main
