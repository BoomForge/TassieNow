# Recovery can also be dispatched from the Actions tab if a previous attempt
# was cancelled during simultaneous catalogue refreshes.
name: Restore verified catalogue media
on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore-licensed-images.mjs'
      - '.github/workflows/recover-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tassienow-data-writes
  queue: max
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Recover only identity-matched, attribution-verified historical images
        run: |
          git show da31ddb4d:src/data/places.json > /tmp/tassienow-known-good-places.json
          node scripts/restore-licensed-images.mjs /tmp/tassienow-known-good-places.json
      - name: Audit and validate restored catalogue
        run: |
          node scripts/catalogue-audit.mjs
          node scripts/validate-data.mjs
      - name: Build before publication
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit validated non-destructive restoration
        run: |
          if git diff --quiet -- src/data/places.json src/data/catalogue-audit.json; then
            echo "No identity-matched licensed images require restoration."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/places.json src/data/catalogue-audit.json
          git commit -m "data: recover identity-matched previously verified licensed imagery"
          git pull --rebase origin main
          git push origin HEAD:main
