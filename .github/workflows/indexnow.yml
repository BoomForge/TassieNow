name: Notify search engines and preserve pages

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/data/places.json'
      - 'src/data/events.json'
      - 'public/robots.txt'
      - 'public/30516139ed96092d5fbd7676d4852aa2.txt'
      - 'scripts/indexnow.mjs'
      - 'scripts/archive-wayback.mjs'
      - 'astro.config.mjs'
      - '.github/workflows/indexnow.yml'
  schedule:
    - cron: '45 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tassienow-search-discovery
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide whether this needs a full URL submission
        shell: bash
        run: |
          FULL=0

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FULL=1
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED="$(git diff --name-only HEAD^ HEAD || true)"
            echo "Changed files:"
            echo "$CHANGED"

            if grep -Eq '^(src/pages/|src/layouts/|src/styles/|astro\.config\.mjs|public/robots\.txt)' <<<"$CHANGED"; then
              FULL=1
            fi
          fi

          echo "FULL_SUBMIT=$FULL" >> "$GITHUB_ENV"

      - name: Notify IndexNow participants and Google WebSub
        env:
          SITE_URL: https://tassienow.com
          FULL_SUBMIT: ${{ env.FULL_SUBMIT }}
        run: node scripts/indexnow.mjs

      - name: Preserve changed public pages in Wayback Machine
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SITE_URL: https://tassienow.com
          FULL_SUBMIT: ${{ env.FULL_SUBMIT }}
          MAX_WAYBACK_URLS: '4'
        run: node scripts/archive-wayback.mjs
