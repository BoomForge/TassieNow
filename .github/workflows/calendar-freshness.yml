name: Refresh TassieNow calendar pages

on:
  schedule:
    # 02:20 AEDT / 01:20 AEST. A daily commit triggers the existing Pages build.
    - cron: '20 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-render-day.mjs'
      - '.github/workflows/calendar-freshness.yml'

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Tasmanian calendar day
        run: node scripts/refresh-render-day.mjs
      - name: Commit changed calendar day
        run: |
          if git diff --quiet -- public/data/site-build-date.json; then
            echo "Calendar already up to date."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/site-build-date.json
          git commit -m "chore: advance Tasmanian calendar for static pages"
          # Scheduled report writers can update main between fetch and push.
          # Rebase and retry rather than losing the calendar update to a ref race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published Tasmanian calendar checkpoint."
              exit 0
            fi
            echo "Concurrent main update; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "::error::Calendar checkpoint could not be published after five rebases"
          exit 1
