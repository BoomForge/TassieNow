name: Check independent event photo discovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-event-images.mjs'
      - 'scripts/discover/lib/event-media.mjs'
      - 'scripts/discover/lib/event-image-policy.mjs'
      - '.github/workflows/event-photo-research.yml'
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  inspect-event-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save event photo baseline before independent research
        run: cp src/data/events.json /tmp/tassienow-events-independent-before.json
      - name: Independently examine near-term event photos and organiser sources
        env:
          MAX_EVENT_IMAGE_ENRICH: '24'
        run: node scripts/enrich-event-images.mjs
      - name: Validate event-image discovery evidence contract
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("reports/event-image-discovery.json","utf8"));
            if(!r.checkedAt||!Number.isInteger(r.checked)||(r.checked===0&&r.missingAfter>0)||!Array.isArray(r.unresolved)||!Array.isArray(r.needsPermission))
              throw Error("No usable event-image research evidence. Check upstream source access.");
            console.log("Event images checked: "+r.checked+"; licensed photographs found: "+r.published+
              "; organiser assets awaiting rights review: "+r.organiserCandidates+
              "; unresolved matches: "+r.unresolved.length+".");
          '
      - name: Preserve independently observed event media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-event-media-research
          path: |
            reports/event-image-discovery.json
            src/data/event-media-review.json
          retention-days: 30
      - name: Commit durable licensed photos and organiser-photo review candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/event-media-review.json /tmp/tassienow-event-media-candidates.json
          cp src/data/events.json /tmp/tassienow-events-independent-after.json
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/reapply-event-review.mjs /tmp/tassienow-event-media-candidates.json
            node scripts/reapply-event-image-upgrades.mjs /tmp/tassienow-events-independent-before.json /tmp/tassienow-events-independent-after.json
            node scripts/catalogue-audit.mjs
            node scripts/validate-data.mjs
            if git diff --quiet -- src/data/events.json src/data/event-media-review.json src/data/catalogue-audit.json; then
              echo "All verified photos and rights-review candidates already persisted."
              exit 0
            fi
            photo_update=0
            if ! git diff --quiet -- src/data/events.json; then photo_update=1; fi
            git add src/data/events.json src/data/event-media-review.json src/data/catalogue-audit.json
            if [ "$photo_update" -eq 1 ]; then
              git commit -m "data: publish licensed independent event media"
            else
              git commit -m "data: retain organiser-photo rights research [skip ci]"
            fi
            if git push origin HEAD:main; then
              if [ "$photo_update" -eq 1 ]; then
                gh workflow run verify-published-event-images.yml --ref main
                gh workflow run verify-event-artwork.yml --ref main
                gh workflow run verify-event-image-files.yml --ref main
              fi
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not preserve organiser-photo candidates after four safe retries."
          exit 1
