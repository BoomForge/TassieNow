name: TassieNow deep catalogue quality

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-details.mjs'
      - 'scripts/enrich-wikidata-metadata.mjs'
      - 'scripts/verify-official-sources.mjs'
      - 'scripts/enrich-official-pages.mjs'
      - 'scripts/enrich-wikidata-images.mjs'
      - 'scripts/enrich-images.mjs'
      - 'scripts/catalogue-audit.mjs'
      - '.github/workflows/catalogue-deep-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  cancel-in-progress: false

jobs:
  deep-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Enrich every OSM and structured listing
        run: node scripts/enrich-details.mjs
      - name: Harvest Wikidata official metadata for every linked listing
        run: node scripts/enrich-wikidata-metadata.mjs
      - name: Verify and promote official sources
        run: node scripts/verify-official-sources.mjs
      - name: Deep crawl verified official pages
        run: node scripts/enrich-official-pages.mjs
      - name: Fill Wikidata and Commons-category media galleries
        env:
          MAX_WIKIDATA_MEDIA: '1400'
          WIKIDATA_GALLERY_SIZE: '8'
        run: node scripts/enrich-wikidata-images.mjs
      - name: Exhaustive licensed Commons sweep for remaining media gaps
        env:
          MAX_IMAGE_ENRICH: '1400'
          GALLERY_SIZE: '8'
        run: node scripts/enrich-images.mjs
      - name: Re-rank after maximum enrichment
        run: node scripts/rank-catalogue.mjs
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Generate full enrichment audit
        run: node scripts/catalogue-audit.mjs
      - name: Validate catalogue
        run: node scripts/validate-data.mjs
      - name: Build production site
        run: npm run build
      - name: Commit deep quality improvements
        run: |
          if git diff --quiet -- src/data/places.json src/data/events.json src/data/catalogue-audit.json; then
            echo "No deep quality changes to commit."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/places.json src/data/events.json src/data/catalogue-audit.json
          git commit -m "data: deep-enrich full TassieNow catalogue"
          git push origin HEAD:main
