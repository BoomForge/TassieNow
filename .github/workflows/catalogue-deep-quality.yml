name: TassieNow deep catalogue quality

on:
  workflow_run:
    workflows: ['Refresh TassieNow catalogue']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tassienow-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  deep-enrichment:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Save verified-media baseline
        run: cp src/data/places.json /tmp/tassienow-before-deep-quality.json
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Enrich every OSM and structured listing
        run: node scripts/enrich-details.mjs
      - name: Resolve every safe Wikidata match
        env:
          MAX_WIKIDATA_LINKS: '1400'
          WIKIDATA_LINK_CONCURRENCY: '5'
        run: node scripts/link-wikidata.mjs
      - name: Harvest Wikidata official metadata for every linked listing
        run: node scripts/enrich-wikidata-metadata.mjs
      - name: Verify and promote official sources
        run: node scripts/verify-official-sources.mjs
      - name: Deep crawl verified official pages
        env:
          MAX_OFFICIAL_CHILD_PAGES: '10'
        run: node scripts/enrich-official-pages.mjs
      - name: Fill Wikidata and Commons-category media galleries
        env:
          MAX_WIKIDATA_MEDIA: '1400'
          WIKIDATA_GALLERY_SIZE: '8'
        run: node scripts/enrich-wikidata-images.mjs
      - name: Exhaustive licensed Commons sweep for remaining media gaps
        env:
          MAX_IMAGE_ENRICH: '1400'
          GALLERY_SIZE: '8'
        run: node scripts/enrich-images.mjs
      - name: Re-rank after maximum enrichment
        run: node scripts/rank-catalogue.mjs
      - name: Recover known-good licensed images before publication
        run: |
          git show da31ddb4d:src/data/places.json > /tmp/tassienow-known-good-media.json
          node scripts/restore-licensed-images.mjs /tmp/tassienow-known-good-media.json
      - name: Guard against large real-photo hero loss
        run: node scripts/check-media-regression.mjs /tmp/tassienow-before-deep-quality.json
      - name: Prune expired events
        run: node scripts/prune-expired-events.mjs
      - name: Generate full enrichment audit
        run: node scripts/catalogue-audit.mjs
      - name: Validate catalogue
        run: node scripts/validate-data.mjs
      - name: Build production site
        run: npm run build
      - name: Commit deep quality improvements
        run: |
          if git diff --quiet -- src/data/places.json src/data/events.json src/data/catalogue-audit.json; then
            echo "No deep quality changes to commit."
            exit 0
          fi
          git config user.name "TassieNow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/places.json src/data/events.json src/data/catalogue-audit.json
          git commit -m "data: deep-enrich full TassieNow catalogue"
          git pull --rebase origin main
          git push origin HEAD:main
